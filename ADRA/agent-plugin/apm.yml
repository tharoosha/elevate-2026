name: adra-agent-plugin
version: 0.1.0
description: Prebuilt agent commands for the Adra product suite (Balancer, Matcher, TaskManager) — grooming, code review, and more to come.
license: UNLICENSED
targets:
  - copilot
  - claude
  - cursor
includes: auto
dependencies:
  mcp:
    - name: atlassian
      registry: false
      transport: http
      url: https://mcp.atlassian.com/v1/mcp/authv2
      # No headers/token here on purpose: this endpoint does per-user OAuth 2.1
      # in the client itself on first use. Each team member authenticates with
      # their own Atlassian account the first time their client calls it —
      # access then follows their existing Jira/Confluence permissions.
    - name: azure-devops
      registry: false
      transport: stdio
      command: npx
      args:
        - "-y"
        - "@azure-devops/mcp"
        - adramatch
      # No token here on purpose: first tool call opens an interactive
      # Microsoft account browser login. Each team member authenticates with
      # their own account — access then follows their existing Azure DevOps
      # (dev.azure.com/adramatch) permissions. Requires Node.js 20+.
